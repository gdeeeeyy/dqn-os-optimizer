[package]
name = "cpu_scheduler_optimizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cpu_scheduler_optimizer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

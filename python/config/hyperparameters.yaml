model:
  state_dim: 12
  action_dim: 5
  hidden_dim: 256

training:
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 128
  memory_size: 50000
  target_update_freq: 500

exploration:
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.9995

rewards:
  cpu_weight: 2.0
  stability_weight: 3.0
  fairness_weight: 1.5
  latency_weight: 2.0
  context_switch_weight: 1.0
  load_balance_weight: 1.0
